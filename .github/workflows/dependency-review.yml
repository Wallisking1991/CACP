name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: vulnerable dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
