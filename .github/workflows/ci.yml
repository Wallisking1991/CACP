name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality / node 24
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck source and tests
        run: corepack pnpm typecheck

      - name: Test with coverage gates
        run: corepack pnpm test:coverage

      - name: Build
        run: corepack pnpm build

      - name: Install browser for whiteboard smoke test
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Test whiteboard collaboration in two browsers
        run: corepack pnpm test:whiteboard-browser

      - name: Scan working tree with Secretlint
        run: corepack pnpm security:secrets

      - name: Scan git history with Gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          git --redact --no-banner /repo

      - name: Audit production dependencies
        run: corepack pnpm security:audit

      - name: Package Local Connector
        run: corepack pnpm package:connector

      - name: Verify generated connector archive
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -s "packages/web/public/downloads/CACP-Local-Connector-v${VERSION}.zip"

  compatibility:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - "22.12.0"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run tests
        run: corepack pnpm test
